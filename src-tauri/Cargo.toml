[package]
name = "scaricatore-di-porto"
version = "0.1.0"
description = "Scaricatore Di Porto — cross-platform downloader and transcriber"
authors = ["Scaricatore Di Porto contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85" # edition 2024 floor

[lib]
# The `_lib` suffix keeps the lib name unique and avoids clashing with the bin
# name on Windows (cargo#8519).
name = "scaricatore_di_porto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Kept in step with the @tauri-apps/* npm packages: the CLI refuses to run on a
# major/minor mismatch between the Rust crates and the JS packages.
# (tauri-build has its own version line and is NOT tied to the tauri crate.)
tauri = { version = "2.12", features = [] }
# Allowed plugins only (spec §1 weight rules): dialog, opener, single-instance.
# NOTE: tauri-plugin-shell is forbidden (spec §1).
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# Protocol-handler (deep-link) support is deferred to a later phase: it would
# pull in tauri-plugin-deep-link, and the `deep-link` feature is not needed for
# the M0-A "second launch focuses the first window" behaviour (spec §3).
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Provisioning (spec §5.2). Feature list is the one spec §1 line 49 fixes:
# `default-features = false` + rustls, **no OpenSSL**, stream for the download
# loop and json for the release metadata.
# NOTE: those feature names only exist on the 0.12 line. reqwest 0.13 renamed
# them (`rustls`, `native-tls`, …), so bumping the major without re-reading the
# spec would silently drop TLS entirely.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
# Checksum verification of every downloaded tool (spec §5.2 "verify sha256").
sha2 = "0.10"
# Archive extraction with path-traversal protection (spec §5.2). All pure Rust:
# flate2's `rust_backend` (miniz_oxide) and zip's `deflate-flate2-rs`, so there
# is no C toolchain and no OpenSSL to link on any of the three OSes.
# `zip` also pulls flate2; `tar` + `lzma-rs` cover `.tar.gz` and the `.tar.xz`
# that BtbN publishes for Linux ffmpeg.
# `default-features = false` matters: zip's default set includes `xz`, which
# needs the C library liblzma, and `aes-crypto`/`zstd`, neither of which is
# used here.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rs = "0.3"

# Process layer (spec §4). Only the features actually used are enabled
# (AGENTS.md §6 "tokio only with the features needed").
#   process  -> spawn/wait on external tools
#   io-util  -> drain stdout/stderr
#   rt       -> spawn the two reader tasks
#   sync     -> the registry behind the app-exit hook
#   time     -> the 2 s SIGTERM grace period of spec §4.2
#   macros   -> `select!` on the child and the CancellationToken (spec §4.4).
#               Proc-macro only: it adds nothing to the shipped binary.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
# `CancellationToken` (spec §4.4).
tokio-util = { version = "0.7", features = ["rt"] }

# System notification when the queue becomes idle (spec §7.7, §11.8). Added in
# M2; see D79 for the dependency-size measurement that justified it.
# NOT pinned to a newer major-minor: 2.4 is the newest release whose
# `rust-version` stays inside this package's `rust-version = 1.85`, and a
# dependency that cannot be built by the toolchain the project declares is not
# a dependency. The `windows` crate it pulls in is the 0.61 line, separate from
# the 0.62 one spec §4.2 needs; they are independent crates and coexist.
tauri-plugin-notification = "2.4"

# Keyring for Gemini API key storage (spec §10.5).
# Pinned to 3.6 to respect rust-version = 1.85 and pure Rust crypto without OpenSSL.
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
    "linux-native",
] }

[target.'cfg(unix)'.dependencies]
# killpg() for the process-group tree-kill of spec §4.2. Not used on Windows,
# where the same job is done with the `windows` crate below.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Object with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE (spec §4.2).
# Feature list taken from the generated module gates in windows 0.62:
#   CreateJobObjectW  -> Win32_Security (it takes SECURITY_ATTRIBUTES)
#   IO_COUNTERS       -> Win32_System_Threading
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# The downloader tests compute the sha256 of the body they serve, so they
# check the real implementation instead of restating a constant.
sha2 = "0.10"
# `test` gives us tauri::test::mock_* so the IPC handlers can be exercised
# without a window (spec §15 "integration tests run offline on all 3 OSes").
tauri = { version = "2.12", features = ["test"] }
# Only the test profile needs a multi-thread runtime; the app itself uses
# Tauri's runtime.
tokio = { version = "1", features = ["rt-multi-thread"] }

# Fake external tool for the process-layer integration tests (spec §4, §15:
# "fake yt-dlp/ffmpeg/qjs scripts … to test events, cancellation, stderr
# draining"). A `.sh` cannot run on Windows and a `.cmd` cannot run on Unix, so
# it is a small Rust program: cross-platform, offline, no dependencies.
#
# It is declared as an `example`, not as a `[[bin]]`, and that is deliberate: the
# Tauri Linux bundler installs **every** `[[bin]]` of the package into
# `/usr/bin` (verified by listing the contents of the produced .deb), which
# would ship this test helper to every user. `cargo test` builds examples;
# `tauri build` never does, so the helper only exists while the tests run.
[[example]]
name = "fake_tool"
path = "tests/bin/fake_tool.rs"
test = false
bench = false
doc = false

# Fake yt-dlp for the M1 integration tests (spec §15). Same reasoning as
# `fake_tool`: a Rust program so the same tests run on the three OSes, and an
# `example` so the bundler never ships it.
[[example]]
name = "fake_ytdlp"
path = "tests/bin/fake_ytdlp.rs"
test = false
bench = false
doc = false

# Release profile mandated by spec §1 "Weight rules":
# opt-level = "s", lto = true, codegen-units = 1, panic = "abort", strip = true.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
