# Real "Test YouTube extraction" on Linux, Windows and macOS (spec §5.3.6,
# §13.5d: "run the real tool self-test in a nightly job").
#
# MANUAL DISPATCH ONLY, and the reason is the quota: this repository is private
# and every run touches the network, YouTube and the system ffmpeg. One run
# across the three systems costs about 45 minutes of quota (Linux 1x, Windows
# 2x, macOS 10x) and can fail for reasons that are not ours (YouTube changing,
# a video being removed). Making it nightly is the owner's decision, not a
# default: this is started by hand when the real answer is wanted.
#
# What it verifies, and why the normal suite is not enough: the fake yt-dlp of
# `tests/ytdlp_job.rs` proves *our* logic; this job proves that the flags, the
# bundled QuickJS runtime and the merge with ffmpeg really work, on the three
# systems, with the real binary.
#
# The tests are `#[ignore]` locally too (AGENTS.md §6: no test in the normal
# suite depends on live YouTube); here they are invoked explicitly.

name: Self-test

on:
  workflow_dispatch:

# No `cancel-in-progress`: a running self-test has already paid its cost, and two
# simultaneous runs do not get in each other's way.
concurrency:
  group: selftest-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # As in the `check` job: this job does not bundle, and `tauri_build::build()`
  # runs on every cargo invocation (D48). The bundled tools are downloaded for
  # the self-test anyway, but without externalBin the compile does not depend on
  # them.
  TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

jobs:
  selftest:
    name: self-test (${{ matrix.target }})
    strategy:
      # One failing system must not hide the other two: the point of running on
      # three platforms is knowing *which* one differs.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
          - os: macos-26
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # System ffmpeg: the 144p download has to merge two streams and the
      # audio-only path has to produce Opus (spec §5.2.1). Without it the job
      # fails with FFMPEG_MISSING — which is an answer too, but not the one this
      # job exists to measure.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        # `choco` is preinstalled on the Windows runners; --no-progress keeps the
        # log readable and -y avoids prompts that do not exist.
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # The bundled tools: yt-dlp (from the newest release) and qjs (pinned).
      # The token is only for the GitHub API rate limit (D54) and is never
      # printed.
      - name: Fetch the bundled tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:tools

      - name: Where the tools landed
        run: ls -l src-tauri/binaries

      - name: Real self-test and end-to-end download
        working-directory: src-tauri
        run: cargo test --test real_selftest -- --ignored --nocapture --test-threads=1
