# Verifiche e bundle su più sistemi operativi (spec §13.5).
#
# **Solo manuale (D118).** Niente parte da solo: né su push, né su PR. Questo
# workflow si preme dalla pagina Actions, e quando lo si preme fa tutto quello
# che ha sempre fatto:
#   - `check` su Linux (moltiplicatore 1x): fmt, clippy, `cargo test`, il
#     frontend (type-check, test, build), il manifest e la guardia sulle
#     immagini dei runner. E' il cancello degli altri job.
#   - `process-tests` su Windows e macOS: i test del livello processi
#     (Job Object, process group, spec §4), l'unica parte del progetto il cui
#     comportamento cambia davvero da un sistema all'altro. Qui **non** gira su
#     Linux perché su Linux li esegue già `check`.
#   - `bundle` su tutte e tre le piattaforme e `bundle-macos-universal`: gli
#     installer da scaricare. È la parte lenta, ed è la ragione per cui per i
#     soli test c'è l'altro workflow.
#   - `release`, solo se il workflow parte da un tag `v*`: la bozza con gli
#     asset sopra.
#
# Per i **soli test, su tutte e tre le piattaforme**, c'è `process-tests.yml`:
# lo stesso `check` più la matrice dei test su Linux, Windows e macOS, senza
# costruire installer. E' il pulsante da premere per sapere se il codice è sano.
#
# Perché nulla parte da solo: su repository PRIVATO i minuti si pagano (D12), e
# un push di commit non deve avviare runner che nessuno ha chiesto. La scelta
# resta esplicita nel gesto di premere il pulsante invece di essere dedotta dal
# gesto del push.
#
# I target sperimentali di spec §1.1 (macOS Intel, Windows ARM64, Linux arm64)
# NON stanno qui: sono in `tier2.yml`, con un proprio pulsante. Starne nello
# stesso file li faceva partire a ogni avvio manuale di questo workflow.
# Con repository pubblico i runner standard sono gratuiti e illimitati e si
# potrebbe togliere ogni condizione.

name: CI

on:
  workflow_dispatch:

# Un dispatch nuovo annulla il run precedente dello stesso ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Errori di codice localizzati in inglese: i messaggi sono confrontati coi test.
  RUST_BACKTRACE: 1

# ---------------------------------------------------------------------------
# Perché ogni immagine e ogni azione è scritta con la versione esplicita
# ---------------------------------------------------------------------------
# Due lezioni costate una run CI ciascuna, il 13 ottobre 2026:
#
# 1. Le azioni dichiaravano Node 20. Node 20 è stato **rimosso** dai runner il
#    23 settembre 2026, quindi giravano solo perché il runner le forza su
#    Node 24: uno strato di compatibilità di cui GitHub non dichiara la durata.
#    Il confine non è lo stesso major per tutte (checkout e setup-node da v5,
#    upload-artifact da v6, download-artifact da v7), quindi "alzo tutto a v7"
#    sarebbe stato sbagliato due volte.
# 2. `ubuntu-latest` è un'etichetta che **migra da sola**: il 19 ottobre 2026 è
#    passata a Ubuntu 26.04 in una finestra di un mese, e un file che ieri
#    compilava su una base e oggi su un'altra non era cambiato di una riga.
#
# `scripts/check-ci-runners.mjs` fa rispettare entrambe: un'immagine che non
# sia nella sua allowlist o un'azione non registrata fanno fallire il job
# `check`. È il meccanismo con cui la prossima migrazione la decidiamo noi
# invece di scoprirla.

# ---------------------------------------------------------------------------
# Perche' alcuni job azzerano `bundle.externalBin` (D48)
# ---------------------------------------------------------------------------
#
# `tauri_build::build()` sta in build.rs, quindi gira a OGNI invocazione di
# cargo — fmt, clippy, test, build: non solo a `tauri build`. Dichiarando
# `bundle.externalBin` in tauri.conf.json, senza i binari presenti anche
# `cargo check` muore con:
#
#     resource path `binaries/yt-dlp-x86_64-unknown-linux-gnu` doesn't exist
#
# Nei job che NON impacchettano (check, process-tests, tier2) `TAURI_CONFIG`
# azzera externalBin: compilano senza rete e senza i 43 MB dei tool.
# Nei job che IMPACCHETTANO (bundle, bundle-macos-universal) `TAURI_CONFIG` NON
# e' impostato e i tool vengono scaricati davvero, eseguiti e solo allora
# impacchettati.
#
# Non e' una scorciatoia per far passare la CI. Il percorso che produce
# l'installer resta verificato per intero, anzi piu' di prima: i tool vengono
# eseguiti prima di entrare nel pacchetto. Qui si sacrifica solo la
# compilazione di un campo del config che quei job non usano — e si evita che
# il job piu' frequente dipenda dalla rete, che oggi si e' dimostrata
# inaffidabile (D33: l'alias `releases/latest` ha risposto 404 per minuti).

jobs:
  # ---------------------------------------------------------------- check (1x)
  check:
    name: check (ubuntu, lint + test)
    runs-on: ubuntu-24.04
    # Vedi il commento prima dei job: `tauri_build::build()` gira a ogni cargo,
    # e questo job non impacchetta. Azzerare externalBin lo tiene offline.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Pacchetti di sistema: elenco preso dalla pagina "Prerequisites" di Tauri v2
      # (https://v2.tauri.app/start/prerequisites/), verificato pacchetto per
      # pacchetto contro gli indici apt: esistono tutti su 22.04, 24.04 e 26.04.
      # Non usiamo il tray, quindi libayatana-appindicator3-dev non e'
      # strettamente necessario (la feature `tray-icon` di Tauri non e' attiva),
      # ma lo teniamo per allinearci alla fonte invece che fidarci del ragionamento.
      # NB: i commenti stanno SOPRA lo step di proposito. Dentro un blocco `run: |`
      # sono commenti SHELL, e una riga `#` che segue una continuazione `\` tronca
      # il comando: e' esattamente come si e' rotto la prima CI.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        # `--no-fail-fast`: senza, il primo test fallito nasconde tutti gli
        # altri. Il 2026-10-13 un fallimento nella lib ha impedito di vedere
        # che `settings_ipc` (che risponde alla domanda su rename di D15) e i
        # 15 test di integrazione non erano mai partiti: si e' perso un giro
        # di CI intero per scoprirlo. Costa zero minuti di quota.
        run: cargo test --no-fail-fast

      - run: npm run check

      - run: npm test

      - run: npm run build

      # Offline validation of tools.manifest.json: schema, both bundled tools
      # declared for this target, pinned checksums that look like checksums.
      # Runs in every run, costs about a second, and fails before anything is
      # built if the manifest and the spec disagree.
      - name: Validate the tools manifest
        run: npm run check:tools

      # Nessuna immagine fluttuante, nessuna in deprecazione, tutte le azioni su
      # Node 24. Gira in ogni run e costa meno di un secondo: senza, la prossima
      # migrazione di un runner la si scopre da un build rosso invece che da una
      # riga rossa.
      - name: Check the runner images and the actions
        run: npm run check:runners

      # The version lives in three manifest indipendenti e finisce nel NOME dei file
      # prodotti. Senza questo controllo si pubblicherebbe v0.2.0 contenente
      # "..._0.1.0_amd64.deb": binari sbagliati con etichetta sbagliata, e su una
      # release pubblicata non si corregge. Costa 10 secondi.
      - name: Verify the tag matches the manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run check:release -- "${{ github.ref_name }}"

  # ------------------------------------------------------- process tests (2x/10x)
  # `cargo test` nel job `check` gira solo su Linux. Il livello processi
  # (spec §4: Job Object su Windows, process group su Unix, kill dell'albero,
  # drenaggio di stdout+stderr, assenza di finestre di console) e' l'unica
  # parte del progetto che si comporta davvero in modo diverso da un sistema
  # all'altro: una suite linux-only darebbe una copertura solo-linux spacciata
  # per multi-OS.
  #
  # Gira a ogni avvio manuale di questo workflow, che è quello che fa tutto: per
  # i soli test senza installer c'è `process-tests.yml` (D118). Linux non è nella
  # matrice perché i suoi test li esegue già `check`.
  process-tests:
    name: process tests (${{ matrix.label }})
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Compila senza externalBin: questo job prova il livello processi con i
    # falsi tool, non impacchetta, e non deve dipendere dalla rete. Vedi il
    # commento prima dei job.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stesse immagini del job `bundle`: sono i due target Tier 1 (spec §1.1)
          # su cui il processo di download deve funzionare davvero.
          - os: windows-2022
            label: windows-x64
          - os: macos-26
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev libxdo-dev librsvg2-dev \
            build-essential curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Nessun test di questa suite tocca la rete ne richiede un tool reale: si
      # eseguono contro il binario `fake_tool` compilato insieme ai test
      # (src-tauri/tests/bin/fake_tool.rs).
      - name: cargo test (real spawn, job object / process group)
        working-directory: src-tauri
        # `--no-fail-fast` per lo stesso motivo del job `check`: vedere tutto in
        # una run sola vale piu' di una run che si ferma al primo rosso.
        run: cargo test --no-fail-fast

  # --------------------------------------------------------------- bundle (2x)
  bundle:
    name: bundle (${{ matrix.label }})
    needs: check
    # I bundle girano a ogni avvio manuale di questo workflow: chi preme "CI" sta
    # chiedendo anche gli installer. Per i soli test senza installer c'è
    # `process-tests.yml` (D118).
    #
    # Motivo per cui non sono un job da push: su repo PRIVATO il piano Free
    # include 500 MB di spazio artifact (condiviso con Packages). Ogni run occupa
    # almeno 108 MB solo di AppImage, quindi con retention 14 giorni bastava 3-4
    # push in due settimane per sforare la quota ed essere fatturato (D19).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Immagine scelta a mano, e non una major dietro l'altra: spec §13.5 e
          # §5.4 vogliono il .deb costruito sul piu' vecchio sistema supportato,
          # cosi' gira anche su distribuzioni piu' recenti (glibc e webkit2gtk sono
          # linkati dinamicamente). 24.04 e' la piu' vecchia delle due che GitHub
          # mantiene insieme (24.04 e 26.04): 22.04 era in deprecazione dal
          # 17 settembre 2026, con quattro brownout a marzo-aprile 2027 e
          # dismissione il 17 aprile 2027 (actions/runner-images#14254). Passando
          # a 24.04 il glibc minimo richiesto sale, quindi vanno rimisurati .deb,
          # .rpm e AppImage: le soglie e le dimensioni di oggi non valgono piu'.
          # Il lato "moderno" e' coperto da `check`, che gira su 24.04.
          # Nota per chi torna indietro: su jammy webkit2gtk era stato
          # aggiornato solo per amd64/i386 (arm64 era ancora a 2.36), ed e'
          # il motivo per cui `tier2` usava `ubuntu-24.04-arm` e non 22.04.
          # Con 24.04 quel problema cade.
          - os: ubuntu-24.04
            label: linux-x64
          # Windows: `windows-latest` e' passato a Windows Server 2025 con
          # **Visual Studio 2026** (giugno 2026). Fissiamo `windows-2022` per due
          # motivi: e' l'immagine piu' vecchia (SDK piu' basso -> il binario gira
          # su piu' versioni di Windows, che e' la nostra politica "prodotto piu'
          # vecchio = massima compatibilita'") ed e' quella su cui l'ecosistema
          # Tauri e' piu' testato. Per tornare a `windows-latest` basta cambiare
          # questa riga.
          - os: windows-2022
            label: windows-x64
          # macOS: `macos-26` e' l'arm64 (Apple Silicon), target Tier 1 della
          # spec §1.1. E' la stessa immagine di `macos-latest`: la scriviamo
          # esplicita perche' `-latest` migra da sola, e un runner che cambia
          # senza che il file cambi e' il modo in cui ci si ritrova con un build
          # diverso e nessun diff che lo spieghi. Il binario universale sta
          # nel job separato `bundle-macos-universal`.
          - os: macos-26
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The updater artifacts are signed at build time (spec §13.4). Without a
      # key Tauri fails halfway through the bundle with a bundler error, so
      # check first and say exactly which repository secret is missing.
      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; add the updater private key to the repository secrets."
            exit 1
          fi

      # NOTA: non si usa `cargo build --release` da solo. Tauri decide
      # "dev vs release" con la feature `custom-protocol`, e solo la CLI la
      # attiva: senza, l'app cercherebbe il frontend sul server di sviluppo.
      #
      # I tool inclusi (spec §5.2.1) arrivano da `fetch_bundled_tools.mjs`: senza
      # questa chiave `bundle.externalBin` fallirebbe con un errore poco chiaro.
      # Il triple viene derivato dal runner (rustc --print host-tuple), cosi' il
      # bundle universale cerca `qjs-universal-apple-darwin` e non il binario
      # nativo: il job universale imposta SDP_TARGET_TRIPLE.
      - name: Fetch the bundled tools
        # Il token e' di GitHub e va solo a api.github.com: serve a tirare su
        # il rate limit (60 richieste/ora per IP senza autenticazione, e i
        # runner ospitati da GitHub condividono intervalli di IP — il 2026-10-13
        # `bundle (macos-arm64)` ha preso HTTP 403 per questo). Non viene mai
        # stampato: `fetch_bundled_tools.mjs` lo mette solo nell'header
        # `authorization` e non lo scrive in nessun messaggio (AGENTS.md 7).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:tools

      - name: Report which tools are about to be bundled
        run: ls -l src-tauri/binaries

      # Spec §5.2.1: "with no internet, the bundled yt-dlp and qjs run
      # (--version)". Qui la verifica avviene DAVVERO, sui binari appena
      # scaricati e verificati, prima che finiscano nell'installer.
      - name: Run the real bundled tools
        working-directory: src-tauri
        run: cargo test --test bundled_tools -- --nocapture

      - name: Build the bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Report bundle sizes
        run: node scripts/report-bundle-sizes.mjs

      # Su macOS un `.app` e' una CARTELLA e GitHub non accetta cartelle come
      # asset: va zipato. Lo zipiamo QUI, sul runner macOS, con `ditto`: e' lo
      # strumento nativo che preserva symlink e permessi, e zipparlo da Linux
      # produrrebbe un .app subtly rotto. Il nome include la label della matrice
      # perche' i due job macOS produrrebbero altrimenti lo stesso nome file.
      #
      # Dopo aver zippato, l'.app VIENE CANCELLATO: altrimenti l'upload lo
      # include come albero di file e nella release finiscono anche i suoi file
      # interni sciolti (il binario `scaricatore`, ecc.) accanto agli zip giusti.
      - name: Pack the macOS .app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in src-tauri/target/release/bundle/dmg/*.app; do
            out="${{ matrix.label }}-$(basename "$app" .app).app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
            rm -rf "$app"
            echo "packed and removed: $out"
          done

      # One artifact per format on Linux, and **only the installable file** in
      # each.
      #
      # A manual run (`workflow_dispatch`) is how files are obtained to try by
      # hand, and GitHub hands an artifact back as a single zip: with
      # `bundle/**` in one artifact, taking the `.deb` meant downloading the
      # AppImage with it.
      #
      # The globs name files, never `**`: the bundlers leave the *unpacked*
      # package next to the installer (`bundle/deb/<name>/data/usr/…`,
      # `bundle/appimage/<name>.AppDir/`, `bundle/squashfs-root/`), and a local
      # build shows what that costs — the 42 MB `.deb` arrived as a 127 MB
      # artifact and the 148 MB AppImage as a 251 MB one. The same trees were
      # about to be attached to the draft release by the flatten step.
      # `*.AppImage*` covers the raw AppImage, its updater `.sig`, and the
      # `.AppImage.tar.gz` a legacy v1-compatible build would add. The raw
      # AppImage is what a first install downloads and what the v2 updater
      # replaces on Linux.
      #
      # Windows ships one format (`nsis`) and macOS two files of the same
      # product (the `.dmg` and the `.app.zip`), so a single artifact stays
      # right there.
      - name: Upload the .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: scaricatore-di-porto-${{ matrix.label }}-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload the .rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: scaricatore-di-porto-${{ matrix.label }}-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload the AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: scaricatore-di-porto-${{ matrix.label }}-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error
          retention-days: 14

      - name: Upload the bundle
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: scaricatore-di-porto-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe*
            src-tauri/target/release/bundle/dmg/*.dmg
            ${{ runner.os == 'macOS' && format('{0}/*.app.zip', matrix.label) || '' }}
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------ universal macOS (M7)
  #-job separato: se fallisce non deve bloccare il .app nativo, che è quello
  #  che serve per il test manuale su Apple Silicon.
  bundle-macos-universal:
    name: bundle (macos universal)
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Same check as the native bundle job: signing is not optional when
      # `createUpdaterArtifacts` is true (spec §13.4).
      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; add the updater private key to the repository secrets."
            exit 1
          fi

      # Il bundle universale cerca `qjs-universal-apple-darwin`, che solo un
      # `lipo` sulle due slice native può produrre (spec §5.2.1): la variabile
      # d'ambiente è il modo più semplice per dirlo allo script di fetch senza
      # duplicare il resto del job.
      - name: Fetch the bundled tools (universal)
        env:
          SDP_TARGET_TRIPLE: universal-apple-darwin
          # vedi il commento sul token nel fetch del job `bundle`
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:tools

      - name: Report which tools are about to be bundled
        run: ls -l src-tauri/binaries

      # Ogni file deve essere l'architettura che il SUO NOME promette, non solo
      # "l'universale e' universale": un file che mente sul proprio nome produce
      # un .app che parte su una CPU e non sull'altra, e la cosa migliore che
      # possa capitare e' che fallisca qui invece che su un Intel al primo
      # avvio. I due file per-archettonura servono al build script (che chiede
      # i nomi per-arch, una volta per ogni slice); quello universale serve al
      # bundler. Vedi D50.
      - name: Every bundled file is the architecture its name promises
        run: |
          set -euo pipefail
          check_fat() {
            file="$1"; shift
            if [ ! -f "$file" ]; then echo "::error::$file non esiste"; exit 1; fi
            info="$(lipo -info "$file")"
            echo "$info"
            # Le due forme esatte, non "fat file": la riga di un file singolo
            # e' "Non-fat file: ..." e contiene la sottostringa "fat file", quindi
            # un controllo piu' largo accetterebbe - o peggio rifiuterebbe - il
            # file sbagliato. Verificato qui con un lipo finto (D50).
            case "$info" in
              *"Architectures in the fat file"*) ;;
              *) echo "::error::$file doveva essere un fat binary: $info"; exit 1 ;;
            esac
            for arch in "$@"; do
              case " $info " in
                *" $arch "*) ;;
                *) echo "::error::$file non contiene $arch: $info"; exit 1 ;;
              esac
            done
          }
          check_single() {
            file="$1"; want="$2"
            if [ ! -f "$file" ]; then echo "::error::$file non esiste"; exit 1; fi
            info="$(lipo -info "$file")"
            echo "$info"
            # Basta questo: un fat binary produce "Architectures in the fat
            # file: ... are: ...", che non contiene mai "is architecture:", quindi
            # una slice che e' in realta universale viene gia' respinta qui.
            # Un secondo controllo "e' un fat file?" sarebbe un ramo che nessun
            # test puo' raggiungere, cioe' un'affermazione che non puoi verificare.
            case "$info" in
              *"is architecture: $want") ;;
              *) echo "::error::$file doveva essere solo $want: $info"; exit 1 ;;
            esac
          }
          for tool in yt-dlp qjs; do
            check_fat "src-tauri/binaries/$tool-universal-apple-darwin" x86_64 arm64
            check_single "src-tauri/binaries/$tool-aarch64-apple-darwin" arm64
            check_single "src-tauri/binaries/$tool-x86_64-apple-darwin" x86_64
          done

      # Spec §13.2 chiede il binario universale (arm64 + x86_64). Job separato perche'
      # se fallisce non deve bloccare il .app nativo arm64, che e' quello che
      # serve al test manuale su Apple Silicon. `macos-26` e' arm64: per la
      # slice Intel serve il target `x86_64-apple-darwin` (installato sopra) e il
      # lipo che fa Tauri. NON FIRMATO: la notarizzazione resta umana
      # (docs/SPIKES.md).
      - name: Build the universal bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin

      # PRIMA di "Pack the universal .app", che cancella la `.app`: dopo non
      # ci sarebbe piu' niente da misurare. Il bundle universale vive in
      # `target/universal-apple-darwin/`, quindi il percorso va passato.
      - name: Report bundle sizes
        run: node scripts/report-bundle-sizes.mjs
        env:
          SDP_TARGET_DIR: src-tauri/target/universal-apple-darwin

      # Vedi il commento nel job `bundle`: `.app` e' una cartella e va zipato con
      # `ditto` sul runner macOS, non da Linux. Poi viene cancellata.
      - name: Pack the universal .app
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.app; do
            out="macos-universal-$(basename "$app" .app).app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
            rm -rf "$app"
            echo "packed and removed: $out"
          done

      - name: Upload the universal bundle
        uses: actions/upload-artifact@v7
        with:
          name: scaricatore-di-porto-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
            macos-universal-*.app.zip
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- draft release (v*)
  # Raccoglie gli artifact dei job di build e crea una Release **in bozza**.
  # Bozza e non pubblicata: se un file e' sbagliato la si cancella, mentre una
  # release pubblicata non si puo' piu' correggere. La pubblichi con un clic dalla
  # pagina Releases, dopo aver scaricato e provato i binari.
  release:
    name: draft release
    needs: [check, process-tests, bundle, bundle-macos-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Solo questo job puo' scrivere: il workflow globale resta in sola lettura.
    permissions:
      contents: write
    steps:
      # The manifest generator lives in the repository, so the release job
      # needs a checkout. The other steps only consume downloaded artifacts.
      - uses: actions/checkout@v7

      - name: Collect every artifact
        uses: actions/download-artifact@v8
        with:
          pattern: scaricatore-di-porto-*
          path: assets
          merge-multiple: true

      # Gli artifact conservano la struttura delle cartelle, quindi gli asset
      # avrebbero nomi tipo "deb/x.deb". Li appiattiamo: l'utente vede il nome
      # del file vero. `-mindepth 2` tocca solo i file dentro le sottocartelle,
      # cosi' gli zip gia' in `assets/` non vengono "spostati su se stessi".
      - name: Flatten the files
        run: |
          set -euo pipefail
          find assets -mindepth 2 -type f -exec sh -c 'mv "$1" "assets/$(basename "$1")"' _ {} \;
          find assets -mindepth 1 -type d -empty -delete
          echo "--- asset da allegare ---"
          ls -la assets

      # The updater endpoint is `releases/latest/download/latest.json`
      # (spec §13.4). Generating it here, after the flatten, means the URLs
      # name the files that are actually attached to this release. The script
      # fails if any platform or `.sig` is missing, so a partial release never
      # reaches `gh release create`.
      - name: Generate the updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/generate-latest-json.mjs --assets assets

      # A release carries installers, and nothing else.
      #
      # The bundlers leave the *unpacked* package next to the installer
      # (`bundle/deb/<name>/data/usr/…`, `bundle/appimage/<name>.AppDir/`,
      # `bundle/squashfs-root/`): a local build shows the 42 MB `.deb` becoming
      # a 127 MB artifact and the 148 MB AppImage a 251 MB one. The upload globs
      # name files now, and this is the guard that says so out loud — a tag with
      # a stray tree in it would be a draft release full of hundreds of files
      # nobody asked for. The list is the one thing that decides what a release
      # may contain; adding a new format means adding it here too.
      - name: Only installers reached the release
        run: |
          set -euo pipefail
          unexpected=""
          while IFS= read -r file; do
            case "$file" in
              *.deb | *.rpm | *.AppImage | *.AppImage.tar.gz | *.dmg | *.app.zip | *.app.tar.gz | *.exe | *.msi | *.sig) ;;
              *SHA256SUMS | *latest.json) ;;
              *) unexpected="${unexpected}${file}"$'\n' ;;
            esac
          done < <(find assets -type f | sort)
          if [ -n "$unexpected" ]; then
            echo "::error::these assets are not installers and must not be released:"
            printf '%s' "$unexpected"
            exit 1
          fi
          echo "every file in assets/ is an installable artifact"

      - name: Create the draft release
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" assets/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          # GITHUB_TOKEN e' automatico: nessun secret da configurare.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
