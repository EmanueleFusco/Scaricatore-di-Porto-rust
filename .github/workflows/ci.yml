# Verifiche e bundle su più sistemi operativi (spec §13.5).
#
# Due scelte, per non sprecare i minuti gratuiti di un repository PRIVATO:
#   - `check` gira solo su Linux (moltiplicatore 1x) a ogni push e PR: feedback veloce.
#   - `bundle` gira su tutte e tre le piattaforme solo quando serve un artefatto
#     da scaricare (push su main, tag, o avvio manuale).
#   - `process-tests` gira su Windows e macOS solo su tag o avvio manuale:
#     i test del livello processi (Job Object, process group, spec §4) sono
#     l'unica parte del progetto il cui comportamento cambia davvero da un
#     sistema all'altro, e `cargo test` nel job `check` li eseguirebbe solo su
#     Linux. Costa ~6 min per target, quindi non a ogni push (costo D12).
# I target sperimentali di spec §1.1 (macOS Intel, Windows ARM64, Linux arm64)
# NON stanno qui: sono in `tier2.yml`, con un proprio pulsante. Starne nello
# stesso file li faceva partire a ogni avvio manuale di questo workflow.
# Con repository pubblico i runner standard sono gratuiti e illimitati e si
# potrebbe togliere ogni condizione.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Un push nuovo annulla il run precedente dello stesso ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Errori di codice localizzati in inglese: i messaggi sono confrontati coi test.
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- check (1x)
  check:
    name: check (ubuntu, lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Pacchetti di sistema: elenco preso dalla pagina "Prerequisites" di Tauri v2
      # (https://v2.tauri.app/start/prerequisites/), verificato pacchetto per
      # pacchetto contro gli indici apt: esistono tutti su 22.04, 24.04 e 26.04.
      # Non usiamo il tray, quindi libayatana-appindicator3-dev non e'
      # strettamente necessario (la feature `tray-icon` di Tauri non e' attiva),
      # ma lo teniamo per allinearci alla fonte invece che fidarci del ragionamento.
      # NB: i commenti stanno SOPRA lo step di proposito. Dentro un blocco `run: |`
      # sono commenti SHELL, e una riga `#` che segue una continuazione `\` tronca
      # il comando: e' esattamente come si e' rotto la prima CI.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        # `--no-fail-fast`: senza, il primo test fallito nasconde tutti gli
        # altri. Il 2026-10-13 un fallimento nella lib ha impedito di vedere
        # che `settings_ipc` (che risponde alla domanda su rename di D15) e i
        # 15 test di integrazione non erano mai partiti: si e' perso un giro
        # di CI intero per scoprirlo. Costa zero minuti di quota.
        run: cargo test --no-fail-fast

      - run: npm run check

      - run: npm test

      - run: npm run build

      # Offline validation of tools.manifest.json: schema, both bundled tools
      # declared for this target, pinned checksums that look like checksums.
      # Runs on EVERY push, costs about a second, and fails before anything is
      # built if the manifest and the spec disagree.
      - name: Validate the tools manifest
        run: npm run check:tools

      # The version lives in three manifest indipendenti e finisce nel NOME dei file
      # prodotti. Senza questo controllo si pubblicherebbe v0.2.0 contenente
      # "..._0.1.0_amd64.deb": binari sbagliati con etichetta sbagliata, e su una
      # release pubblicata non si corregge. Costa 10 secondi.
      - name: Verify the tag matches the manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run check:release -- "${{ github.ref_name }}"

  # ------------------------------------------------------- process tests (2x/10x)
  # `cargo test` nel job `check` gira solo su Linux. Il livello processi
  # (spec §4: Job Object su Windows, process group su Unix, kill dell'albero,
  # drenaggio di stdout+stderr, assenza di finestre di console) e' l'unica
  # parte del progetto che si comporta davvero in modo diverso da un sistema
  # all'altro: una suite linux-only darebbe una copertura solo-linux spacciata
  # per multi-OS.
  #
  # Stessa soglia del job `bundle` (tag o avvio manuale) per non spendere la
  # quota a ogni push: vedi la nota sul budget in cima al file e DECISIONS.md D19.
  process-tests:
    name: process tests (${{ matrix.label }})
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stesse immagini del job `bundle`: sono i due target Tier 1 (spec §1.1)
          # su cui il processo di download deve funzionare davvero.
          - os: windows-2022
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev libxdo-dev librsvg2-dev \
            build-essential curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Nessun test di questa suite tocca la rete ne richiede un tool reale: si
      # eseguono contro il binario `fake_tool` compilato insieme ai test
      # (src-tauri/tests/bin/fake_tool.rs).
      - name: cargo test (real spawn, job object / process group)
        working-directory: src-tauri
        # `--no-fail-fast` per lo stesso motivo del job `check`: vedere tutto in
        # una run sola vale piu' di una run che si ferma al primo rosso.
        run: cargo test --no-fail-fast

  # --------------------------------------------------------------- bundle (2x)
  bundle:
    name: bundle (${{ matrix.label }})
    needs: check
    # I bundle girano SOLO quando serve un artefatto: tag `v*`, oppure avvio
    # manuale dalla pagina Actions. Non a ogni push su main.
    #
    # Motivo: su repo PRIVATO il piano Free include 500 MB di spazio artifact
    # (condiviso con Packages). Ogni run occupa almeno 108 MB solo di AppImage,
    # quindi con retention 14 giorni bastava 3-4 push in due settimane per
    # sforare la quota ed essere fatturato. Un push normale deve costare solo
    # `check`: 7 minuti e 7 minuti di quota Linux.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # `ubuntu-22.04` (jammy) NON e' un residuo: si compila sul piu'
          # vecchio sistema supportato cosi' che il .deb giri anche su
          # distribuzioni piu' recenti (glibc/webkit-linkato dinamicamente).
          # E' anche cio' che chiede spec §13.5 e spec §5.4 ("oldest supported
          # distro"). Verificato: jammy amd64 ha webkit2gtk 2.50.4.
          # Il lato "moderno" della finestra e' coperto dal job `check`, che gira
          # su `ubuntu-latest`. Attenzione: su jammy il pacchetto webkit2gtk e'
          # stato aggiornato solo per amd64/i386 (arm64 e' ancora a 2.36), quindi
          # per arm64 il job `tier2` usa `ubuntu-24.04-arm` e non 22.04.
          - os: ubuntu-22.04
            label: linux-x64
          # Windows: `windows-latest` e' passato a Windows Server 2025 con
          # **Visual Studio 2026** (giugno 2026). Fissiamo `windows-2022` per due
          # motivi: e' l'immagine piu' vecchia (SDK piu' basso -> il binario gira
          # su piu' versioni di Windows, che e' la nostra politica "prodotto piu'
          # vecchio = massima compatibilita'") ed e' quella su cui l'ecosistema
          # Tauri e' piu' testato. Per tornare a `windows-latest` basta cambiare
          # questa riga.
          - os: windows-2022
            label: windows-x64
          # macOS: `macos-latest` = macOS 26 **arm64** (Apple Silicon), che e'
          # il target Tier 1 della spec §1.1. Il binario universale sta nel job
          # separato `bundle-macos-universal`.
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # NOTA: non si usa `cargo build --release` da solo. Tauri decide
      # "dev vs release" con la feature `custom-protocol`, e solo la CLI la
      # attiva: senza, l'app cercherebbe il frontend sul server di sviluppo.
      #
      # I tool inclusi (spec §5.2.1) arrivano da `fetch_bundled_tools.mjs`: senza
      # questa chiave `bundle.externalBin` fallirebbe con un errore poco chiaro.
      # Il triple viene derivato dal runner (rustc --print host-tuple), cosi' il
      # bundle universale cerca `qjs-universal-apple-darwin` e non il binario
      # nativo: il job universale imposta SDP_TARGET_TRIPLE.
      - name: Fetch the bundled tools
        run: npm run fetch:tools

      - name: Report which tools are about to be bundled
        run: ls -l src-tauri/binaries

      # Spec §5.2.1: "with no internet, the bundled yt-dlp and qjs run
      # (--version)". Qui la verifica avviene DAVVERO, sui binari appena
      # scaricati e verificati, prima che finiscano nell'installer.
      - name: Run the real bundled tools
        working-directory: src-tauri
        run: cargo test --test bundled_tools -- --nocapture

      - name: Build the bundle
        run: npx tauri build

      - name: Report bundle sizes
        run: node scripts/report-bundle-sizes.mjs

      # Su macOS un `.app` e' una CARTELLA e GitHub non accetta cartelle come
      # asset: va zipato. Lo zipiamo QUI, sul runner macOS, con `ditto`: e' lo
      # strumento nativo che preserva symlink e permessi, e zipparlo da Linux
      # produrrebbe un .app subtly rotto. Il nome include la label della matrice
      # perche' i due job macOS produrrebbero altrimenti lo stesso nome file.
      #
      # Dopo aver zippato, l'.app VIENE CANCELLATO: altrimenti l'upload lo
      # include come albero di file e nella release finiscono anche i suoi file
      # interni sciolti (il binario `scaricatore`, ecc.) accanto agli zip giusti.
      - name: Pack the macOS .app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in src-tauri/target/release/bundle/dmg/*.app; do
            out="${{ matrix.label }}-$(basename "$app" .app).app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
            rm -rf "$app"
            echo "pacchettato e rimosso: $out"
          done

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: scaricatore-di-porto-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**
            ${{ runner.os == 'macOS' && format('{0}/*.app.zip', matrix.label) || '' }}
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------ universal macOS (M7)
  #-job separato: se fallisce non deve bloccare il .app nativo, che è quello
  #  che serve per il test manuale su Apple Silicon.
  bundle-macos-universal:
    name: bundle (macos universal)
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Il bundle universale cerca `qjs-universal-apple-darwin`, che solo un
      # `lipo` sulle due slice native può produrre (spec §5.2.1): la variabile
      # d'ambiente è il modo più semplice per dirlo allo script di fetch senza
      # duplicare il resto del job.
      - name: Fetch the bundled tools (universal)
        env:
          SDP_TARGET_TRIPLE: universal-apple-darwin
        run: npm run fetch:tools

      - name: Report which tools are about to be bundled
        run: ls -l src-tauri/binaries

      # Spec §13.2 chiede il binario universale (arm64 + x86_64). Job separato perche'
      # se fallisce non deve bloccare il .app nativo arm64, che e' quello che
      # serve al test manuale su Apple Silicon. `macos-latest` e' arm64: per la
      # slice Intel serve il target `x86_64-apple-darwin` (installato sopra) e il
      # lipo che fa Tauri. NON FIRMATO: la notarizzazione resta umana
      # (docs/SPIKES.md).
      - name: Build the universal bundle
        run: npx tauri build --target universal-apple-darwin

      # PRIMA di "Pack the universal .app", che cancella la `.app`: dopo non
      # ci sarebbe piu' niente da misurare. Il bundle universale vive in
      # `target/universal-apple-darwin/`, quindi il percorso va passato.
      - name: Report bundle sizes
        run: node scripts/report-bundle-sizes.mjs
        env:
          SDP_TARGET_DIR: src-tauri/target/universal-apple-darwin

      # Vedi il commento nel job `bundle`: `.app` e' una cartella e va zipato con
      # `ditto` sul runner macOS, non da Linux. Poi viene cancellata.
      - name: Pack the universal .app
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.app; do
            out="macos-universal-$(basename "$app" .app).app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
            rm -rf "$app"
            echo "pacchettato e rimosso: $out"
          done

      - name: Upload the universal bundle
        uses: actions/upload-artifact@v4
        with:
          name: scaricatore-di-porto-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/**
            macos-universal-*.app.zip
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- draft release (v*)
  # Raccoglie gli artifact dei job di build e crea una Release **in bozza**.
  # Bozza e non pubblicata: se un file e' sbagliato la si cancella, mentre una
  # release pubblicata non si puo' piu' correggere. La pubblichi con un clic dalla
  # pagina Releases, dopo aver scaricato e provato i binari.
  release:
    name: draft release
    needs: [check, process-tests, bundle, bundle-macos-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Solo questo job puo' scrivere: il workflow globale resta in sola lettura.
    permissions:
      contents: write
    steps:
      - name: Collect every artifact
        uses: actions/download-artifact@v4
        with:
          pattern: scaricatore-di-porto-*
          path: assets
          merge-multiple: true

      # Gli artifact conservano la struttura delle cartelle, quindi gli asset
      # avrebbero nomi tipo "deb/x.deb". Li appiattiamo: l'utente vede il nome
      # del file vero. `-mindepth 2` tocca solo i file dentro le sottocartelle,
      # cosi' gli zip gia' in `assets/` non vengono "spostati su se stessi".
      - name: Flatten the files
        run: |
          set -euo pipefail
          find assets -mindepth 2 -type f -exec sh -c 'mv "$1" "assets/$(basename "$1")"' _ {} \;
          find assets -mindepth 1 -type d -empty -delete
          echo "--- asset da allegare ---"
          ls -la assets

      - name: Create the draft release
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" assets/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          # GITHUB_TOKEN e' automatico: nessun secret da configurare.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
